# dsh-code-security 组合包补丁：把 AI 代码安全审查插件行插入 profile。
#
# 示例（用户 profile 的 cordis.patch.yml）：
#   - id: code-security
#     name: 'dsh-code-security'
#     config:
#       maxFiles: 5000
#       maxFileBytes: 2097152
#       failOn: medium
#       stateDir: .code-security
#
- insert:
    - id: code-security
      name: 'dsh-code-security'
      config:
        maxFiles: 5000
        failOn: medium
